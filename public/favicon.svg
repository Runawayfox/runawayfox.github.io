<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b07a10"/>
      <stop offset="35%"  stop-color="#f0d058"/>
      <stop offset="50%"  stop-color="#fdf0b0"/>
      <stop offset="65%"  stop-color="#f0d058"/>
      <stop offset="100%" stop-color="#b07a10"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7a540a"/>
      <stop offset="50%"  stop-color="#c09030"/>
      <stop offset="100%" stop-color="#7a540a"/>
    </linearGradient>
  </defs>

  <!-- Dark background matching site dark mode -->
  <rect width="128" height="128" rx="22" fill="#07070f"/>

  <!-- Fox head + ears: single combined gold silhouette -->
  <path fill="url(#g)" d="
    M 64 120
    C 40 120 18 107 10 89
    C 3 73 3 55 10 43
    L 28 6
    L 46 44
    Q 55 36 64 36
    Q 73 36 82 44
    L 100 6
    L 118 43
    C 125 55 125 73 118 89
    C 110 107 88 120 64 120 Z
  "/>

  <!-- Inner ear shading (dark overlay to create visual ear depth) -->
  <path fill="url(#g2)" d="M 28 6 L 10 43 L 40 44 Z"/>
  <path fill="url(#g2)" d="M 100 6 L 118 43 L 88 44 Z"/>

  <!-- Eyes -->
  <ellipse cx="46" cy="74" rx="7.5" ry="6.5" fill="#07070f"/>
  <ellipse cx="82" cy="74" rx="7.5" ry="6.5" fill="#07070f"/>

  <!-- Eye highlights (tiny gold sparkle) -->
  <circle cx="49" cy="71" r="2" fill="#f0d060" opacity="0.7"/>
  <circle cx="85" cy="71" r="2" fill="#f0d060" opacity="0.7"/>

  <!-- Nose -->
  <ellipse cx="64" cy="93" rx="6" ry="5" fill="#07070f"/>
</svg>
